# Investigation only (never merged): does a code-compacting collection inside
# the sampling profiler's safepoint handler leave stale return addresses on
# arm64? The C++ VM on this branch has a hook, FACTOR_PROFILER_COMPACT_EVERY=N,
# that compacts on every Nth recorded sample. x86-64 is the control: its
# signal stub includes the interrupted PC in the callstack walk.
name: arm64 profiler GC investigation

on:
  push:
    branches: [ investigate/arm64-profiler-gc ]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUN: 'USING: parser words kernel ; "resource:.github/scripts/arm64-profiler-gc.factor" run-file 3 2000000 "main" "arm64-profiler-gc" lookup-word execute( r n -- )'

jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, target: linux-arm-64, image: boot.unix-arm.64.image }
          - { os: ubuntu-24.04,     target: linux-x86-64, image: boot.unix-x86.64.image }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
    - name: build C++ VM
      run: make -j4 ${{ matrix.target }}
    - name: boot image
      run: ./build.sh update-boot-image && ls -la boot.*.image
    - name: bootstrap
      run: ./factor -i=${{ matrix.image }} > bootstrap.log 2>&1 || (tail -60 bootstrap.log; exit 1)
    - name: rebuild with assertions and debug info
      run: |
        make clean > /dev/null
        make -j4 DEBUG=1 ${{ matrix.target }}
    - name: enable core dumps and install gdb
      continue-on-error: true
      run: |
        sudo sysctl -w kernel.core_pattern=core.%p
        sudo apt-get update -qq > /dev/null
        sudo apt-get install -y -qq gdb > /dev/null
        gdb --version | head -1
    - name: reproduce
      run: |
        ulimit -c unlimited
        for every in 0 5 3 2 1; do
          for trial in 1 2 3; do
            log=run-$every-$trial.log
            echo "=== FACTOR_PROFILER_COMPACT_EVERY=$every trial $trial"
            start=$(date +%s)
            rc=0
            FACTOR_PROFILER_COMPACT_EVERY=$every timeout 1200 ./factor -e="$RUN" > $log 2>&1 || rc=$?
            grep -a -E 'rounds ok' $log || true
            echo "exit=$rc after $(( $(date +%s) - start ))s"
            grep -a -m3 -E 'triggered|fatal|assertion|Segmentation|Illegal' $log || true
            for core in core.*; do
              [ -e "$core" ] || continue
              echo "--- core $core"
              if command -v gdb > /dev/null; then
                gdb -batch -q -ex 'thread apply all bt 40' ./factor "$core" > $log.bt 2>&1
                grep -a -E '^#|^Thread' $log.bt | head -60
              fi
              rm -f "$core"
            done
          done
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: logs-${{ matrix.target }}
        path: |
          *.log
          *.bt
